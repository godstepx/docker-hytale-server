name: CI

on:
  push:
    branches: [main, beta]
    tags:
      - 'v*'
  pull_request:
    branches: [main, beta]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript lint
        run: bun run lint

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        env:
          RUN_DOCKER_TESTS: "false"
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bun test

  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ (vars.HYTALE_TEST_SERVER_JAR != '' && vars.HYTALE_TEST_ASSETS_ZIP != '') || (secrets.HYTALE_TEST_SERVER_JAR != '' && secrets.HYTALE_TEST_ASSETS_ZIP != '') }}
    env:
      RUN_DOCKER_TESTS: "true"
      HYTALE_TEST_SERVER_JAR: ${{ vars.HYTALE_TEST_SERVER_JAR || secrets.HYTALE_TEST_SERVER_JAR }}
      HYTALE_TEST_ASSETS_ZIP: ${{ vars.HYTALE_TEST_ASSETS_ZIP || secrets.HYTALE_TEST_ASSETS_ZIP }}
      HYTALE_TEST_IMAGE: docker-hytale-server:test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run docker integration tests
        run: bun test tests/integration.test.ts
